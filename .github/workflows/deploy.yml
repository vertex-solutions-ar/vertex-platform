name: Deploy

on:
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: false
        default: 'production'
        type: choice
        options: [production, development]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  NODE_OPTIONS: '--no-warnings'
  NPM_CONFIG_LOGLEVEL: 'error'
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'
  # No descargar el binario de Cypress en el deploy (solo se usa para E2E en ci.yml).
  # Evita fallos transitorios del CDN de Cypress (502 Bad Gateway) en npm ci.
  CYPRESS_INSTALL_BINARY: '0'

jobs:
  validate:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Run frontend tests
        run: npm run test --workspace=vertex-platform -- --watch=false --exclude="**/functions/**"

      - name: Install backend dependencies
        run: npm ci
        working-directory: vertex-platform/functions

      - name: Run backend tests with coverage
        run: npm run test:coverage
        working-directory: vertex-platform/functions

  build-dev:
    name: Build (Development)
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/develop') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop' && inputs.environment == 'development')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Build development
        run: npm run build:dev --workspace=vertex-platform

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-dev-${{ github.sha }}
          path: vertex-platform/dist/vertex-platform/browser
          retention-days: 1

  build-prod:
    name: Build (Production)
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.environment == 'production')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Build production
        run: npm run build:prod --workspace=vertex-platform

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-prod-${{ github.sha }}
          path: vertex-platform/dist/vertex-platform/browser
          retention-days: 1

  functions-build:
    name: Build Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm ci --no-audit --no-fund
        working-directory: vertex-platform/functions

      - run: npm run build
        working-directory: vertex-platform/functions

  deploy-dev:
    name: '→ Development'
    runs-on: ubuntu-latest
    needs: [validate, unit-tests, build-dev, functions-build]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/develop') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop' && inputs.environment == 'development')
    environment:
      name: development
      url: https://vertex-platform-dev.web.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --legacy-peer-deps --no-audit --no-fund

      - run: npm ci --no-audit --no-fund
        working-directory: vertex-platform/functions

      - name: Build Functions
        run: npm run build
        working-directory: vertex-platform/functions

      - name: Download frontend build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-dev-${{ github.sha }}
          path: vertex-platform/dist/vertex-platform/browser

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}'

      - name: Grant Firestore Rules Admin role to SA
        run: |
          SA_EMAIL=$(gcloud auth list --filter=status:ACTIVE --format='value(account)')
          gcloud projects add-iam-policy-binding vertex-platform-dev \
            --member="serviceAccount:$SA_EMAIL" \
            --role="roles/firebaserules.admin" \
            --condition=None \
            --quiet 2>&1 || echo "Role already exists or not needed"

      - name: Deploy Hosting (Development)
        working-directory: vertex-platform
        run: |
          npx firebase-tools deploy \
            --project vertex-platform-dev \
            --only hosting:dev \
            --non-interactive \
            --force

      - name: Deploy Functions (Development) — resiliente a 409 (cola de Cloud Functions)
        working-directory: vertex-platform
        run: |
          bash ../scripts/deploy-functions.sh vertex-platform-dev

      - name: Grant storefront SA access to shard Firestore (dev)
        run: |
          # Las functions del storefront (ecommerce-vertex-dev, gen 2) usan la SA de
          # Compute Engine — leen/escriben el Firestore del shard → datastore.user.
          # Se otorgan AMBAS SAs (appspot + compute) por robustez.
          for SA in \
            "serviceAccount:ecommerce-vertex-dev@appspot.gserviceaccount.com" \
            "serviceAccount:988454979046-compute@developer.gserviceaccount.com"; do
            gcloud projects add-iam-policy-binding vtx-sd-c3732d17 \
              --member="$SA" \
              --role="roles/datastore.user" \
              --condition=None \
              --quiet 2>&1 || echo "Role already exists or not granted for $SA"
          done

      - name: Post-Deploy Health Check (Development)
        run: |
          echo "Verificando respuesta del sitio desplegado (vertex-platform-dev)..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://vertex-platform-dev.web.app)
          if [ "$STATUS" -eq 200 ] || [ "$STATUS" -eq 304 ]; then
            echo "✅ Platform DEV responde correctamente (HTTP $STATUS)"
          else
            echo "❌ Falló verificación post-deploy en Platform DEV (HTTP $STATUS)"
            exit 1
          fi

  deploy-prod:
    name: '→ Production'
    runs-on: ubuntu-latest
    needs: [validate, unit-tests, build-prod, functions-build]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.environment == 'production')
    environment:
      name: production
      url: https://vertex-platform-app.web.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --legacy-peer-deps --no-audit --no-fund

      - run: npm ci --no-audit --no-fund
        working-directory: vertex-platform/functions

      - name: Build Functions
        run: npm run build
        working-directory: vertex-platform/functions

      - name: Download frontend build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-prod-${{ github.sha }}
          path: vertex-platform/dist/vertex-platform/browser

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'

      - name: Grant Firestore Rules Admin role to SA
        run: |
          SA_EMAIL=$(gcloud auth list --filter=status:ACTIVE --format='value(account)')
          gcloud projects add-iam-policy-binding vertex-platform-app \
            --member="serviceAccount:$SA_EMAIL" \
            --role="roles/firebaserules.admin" \
            --condition=None \
            --quiet 2>&1 || echo "Role already exists or not needed"

      - name: Deploy Hosting (Production)
        working-directory: vertex-platform
        run: |
          npx firebase-tools deploy \
            --project vertex-platform-app \
            --only hosting:prod,hosting:prod-clean \
            --non-interactive \
            --force

      - name: Deploy Functions (Production) — resiliente a 409 (cola de Cloud Functions)
        working-directory: vertex-platform
        run: |
          bash ../scripts/deploy-functions.sh vertex-platform-app

      - name: Post-Deploy Health Check (Production)
        run: |
          echo "Verificando respuesta del sitio desplegado (vertex-platform-app)..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://vertex-platform-app.web.app)
          if [ "$STATUS" -eq 200 ] || [ "$STATUS" -eq 304 ]; then
            echo "✅ Platform PROD responde correctamente (HTTP $STATUS)"
          else
            echo "❌ Falló verificación post-deploy en Platform PROD (HTTP $STATUS)"
            exit 1
          fi
