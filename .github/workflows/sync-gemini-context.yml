name: Sync Gemini Context

on:
  push:
    branches: [develop]

env:
  NODE_OPTIONS: '--no-warnings'
  NPM_CONFIG_LOGLEVEL: 'error'
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'

jobs:
  sync:
    name: Sync Context to Gemini
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate AI Context Markdown
        run: npm run sync-context

      - name: Sync with Gemini API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is not set. Skipping upload."
            exit 0
          fi
          
          # Send generated markdown to Gemini API (Placeholder/Mock endpoint for upload)
          curl -X POST "https://generativelanguage.googleapis.com/v1beta/files" \
            -H "Authorization: Bearer $GEMINI_API_KEY" \
            -H "Content-Type: text/markdown" \
            --data-binary @docs/architecture-context.md
