name: PR Preview Cleanup

on:
  pull_request:
    types: [closed]

permissions:
  checks: write
  contents: write
  deployments: write
  pull-requests: write

env:
  NODE_VERSION: '24'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  cleanup-preview:
    name: Cleanup Preview Channel & Tenant Data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Check secret availability
        id: check
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
        run: |
          if [ -n "$SA" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Delete Firebase Hosting Preview Channel
        if: steps.check.outputs.available == 'true'
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT_DEV: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_DEV" > sa_key.json
          GOOGLE_APPLICATION_CREDENTIALS="$(pwd)/sa_key.json" npx firebase-tools hosting:channel:delete pr-${{ github.event.number }} --project vertex-platform-dev --force || true
          rm -f sa_key.json

      - name: Clean Firestore PR Tenant Data
        if: steps.check.outputs.available == 'true'
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT_DEV: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
          PR_NUMBER: ${{ github.event.number }}
          NODE_PATH: vertex-platform/functions/node_modules
        run: |
          npm --prefix vertex-platform/functions install
          npx tsx scripts/cleanup-pr-tenant.ts

      - name: Comment on PR
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = context.issue.number;
            const body = `### 🗑️ Instancia de Preview Eliminada\n\nEl canal efímero de Firebase Hosting (\`pr-${prNumber}\`) y los datos de prueba asociados en Firestore han sido eliminados con éxito.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body
            });

      - name: Delete Head Branch
        uses: actions/github-script@v9
        with:
          script: |
            const headRef = context.payload.pull_request?.head?.ref;
            const protectedBranches = ['main', 'develop', 'master'];
            if (headRef && !protectedBranches.includes(headRef)) {
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${headRef}`
                });
                console.log(`Successfully deleted branch ${headRef}`);
              } catch (err) {
                console.warn(`Could not delete branch ${headRef}:`, err.message);
              }
            }
