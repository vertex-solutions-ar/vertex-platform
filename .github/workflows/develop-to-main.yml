name: Auto PR develop → main

on:
  push:
    branches: [develop]
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Open/refresh develop → main PR and auto-merge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create or refresh PR and enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch origin develop main --quiet
          if [ "$(git rev-parse origin/develop)" = "$(git rev-parse origin/main)" ]; then
            echo "develop y main están iguales: nada para sincronizar"
            exit 0
          fi
          NUM=$(gh pr list --repo "$REPO" --base main --head develop --state open --json number --jq '.[0].number // empty')
          if [ -z "$NUM" ]; then
            echo "Creando PR develop → main"
            gh pr create --repo "$REPO" --base main --head develop \
              --title "chore(release): sync develop → main" \
              --body "PR automático de sincronización **develop → main**. Se mergea solo (squash) cuando los checks pasan. No borra ramas protegidas." || true
            NUM=$(gh pr list --repo "$REPO" --base main --head develop --state open --json number --jq '.[0].number // empty')
          fi
          [ -z "$NUM" ] && { echo "no se pudo crear/obtener el PR"; exit 0; }
          echo "Habilitando auto-merge en PR #$NUM"
          gh pr merge "$NUM" --repo "$REPO" --auto --squash || \
            gh pr merge "$NUM" --repo "$REPO" --squash || echo "merge no disponible aún"
