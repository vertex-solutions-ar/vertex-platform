name: Auto PR develop → main

on:
  push:
    branches: [develop]
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Open/refresh develop → main PR and auto-merge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create or refresh PR and enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_PAT }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch origin develop main --quiet
          if [ "$(git rev-parse origin/develop)" = "$(git rev-parse origin/main)" ]; then
            echo "develop y main están iguales: nada para sincronizar"
            exit 0
          fi

          TITLE="chore(release): sync develop → main"
          BODY="PR automático de sincronización **develop → main**. Se mergea solo (squash) cuando los checks pasan. No borra ramas protegidas."

          list_pr() {
            gh pr list --repo "$REPO" --base main --head develop --state open \
              --json number --jq '.[0].number // empty'
          }

          NUM=$(list_pr)

          if [ -z "$NUM" ]; then
            echo "Creando PR develop → main"
            # El repo tiene deshabilitado "Allow GitHub Actions to create or approve pull
            # requests", así que GH_TOKEN falla con createPullRequest. Se reintenta con
            # ADMIN_PAT (igual que back-sync.yml) y, si tampoco puede, se avisa
            # explícitamente en lugar de salir en silencio como antes.
            if ! gh pr create --repo "$REPO" --base main --head develop \
                 --title "$TITLE" --body "$BODY" 2>&1; then
              if [ -n "${ADMIN_TOKEN:-}" ]; then
                echo "::warning::GITHUB_TOKEN no pudo crear el PR (repo setting); reintentando con ADMIN_PAT"
                GH_TOKEN="$ADMIN_TOKEN" gh pr create --repo "$REPO" --base main --head develop \
                  --title "$TITLE" --body "$BODY" 2>&1 || true
              else
                echo "::warning::No hay ADMIN_PAT configurado para crear el PR"
              fi
            fi
            NUM=$(list_pr)
          fi

          if [ -z "$NUM" ]; then
            echo "::warning::No se pudo crear/obtener el PR develop → main (promoción manual requerida)"
            exit 0
          fi

          echo "Habilitando auto-merge en PR #$NUM"
          gh pr merge "$NUM" --repo "$REPO" --auto --squash 2>&1 || \
            gh pr merge "$NUM" --repo "$REPO" --squash 2>&1 || \
            echo "::warning::merge no disponible aún para el PR #$NUM"
